; PlatformIO — ESP32-CAM (AI-Thinker-class board, OV2640/OV3660).
; Confirm camera pins in config/pins.h match your module before flashing.

[platformio]
; The per-peripheral modules live in sibling folders of src/ (camera/, display/,
; ...). build_src_filter only globs *inside* src_dir, so point src_dir at the
; firmware root instead of escaping with "../" patterns (which silently match
; nothing and show up as undefined-reference errors at link time).
src_dir = .

[env:esp32cam]
; Pinned to the arduino-esp32 2.0.x line (esp_camera uses pin_sscb_* field names,
; matching camera/camera.cpp). If you move to core 3.x, rename those to pin_sccb_*.
platform = espressif32 @ ^6.5.0
board = esp32cam
framework = arduino
monitor_speed = 921600
upload_speed = 115200

; AI-Thinker ESP32-CAM has PSRAM — needed for larger JPEG framebuffers.
board_build.psram = enable
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I include
    -I config
    -I camera
    -I display
    -I sensors
    -I communication
    -I button
    -I flash
    -I state_machine

; Compile src/main.cpp plus each peripheral module; the superseded .c stubs are
; simply never added back after the blanket exclude.
build_src_filter =
    -<*>
    +<src/main.cpp>
    +<camera/camera.cpp>
    +<display/display.cpp>
    +<sensors/sensors.cpp>
    +<communication/communication.cpp>
    +<button/button.cpp>
    +<flash/flash_led.cpp>
    +<state_machine/state_machine.cpp>

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1

; esp32-camera (esp_camera.h) ships with the arduino-esp32 core — no extra lib.

[env:native]
platform = native
test_framework = unity
build_flags =
    -I include
    -I state_machine
    -D UNIT_TEST
build_src_filter =
    -<*>
    +<state_machine/state_machine.cpp>
