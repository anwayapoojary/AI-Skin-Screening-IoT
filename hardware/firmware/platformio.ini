; PlatformIO — ESP32-CAM (AI-Thinker-class board, OV2640/OV3660).
; Confirm camera pins in config/pins.h match your module before flashing.

[env:esp32cam]
; Pinned to the arduino-esp32 2.0.x line (esp_camera uses pin_sscb_* field names,
; matching camera/camera.cpp). If you move to core 3.x, rename those to pin_sccb_*.
platform = espressif32 @ ^6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; AI-Thinker ESP32-CAM has PSRAM — needed for larger JPEG framebuffers.
board_build.psram = enable
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I include
    -I config
    -I camera
    -I display
    -I sensors
    -I communication
    -I button
    -I flash

; Compile the C++ module implementations; exclude the old C stubs.
build_src_filter =
    +<*>
    +<../camera/camera.cpp>
    +<../display/display.cpp>
    +<../sensors/sensors.cpp>
    +<../communication/communication.cpp>
    +<../button/button.cpp>
    +<../flash/flash_led.cpp>
    -<../camera/camera.c>
    -<../display/display.c>
    -<../sensors/sensors.c>
    -<../communication/communication.c>
    -<../button/button.c>
    -<../flash/flash_led.c>

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1

; esp32-camera (esp_camera.h) ships with the arduino-esp32 core — no extra lib.
