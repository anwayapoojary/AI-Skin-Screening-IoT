services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      DEVICE_MODE: simulation
      AI_MODE: mock
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - appdata:/app/data

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  appdata:
